name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
          cache: true
      - run: pnpm install
      - run: pnpm run typecheck
      - run: pnpm test
